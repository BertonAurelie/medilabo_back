spring.application.name=medilabo
server.port=8080

################### DataSource Configuration ##########################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/medilabo_patient?serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

################### Hibernate Configuration ##########################
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

################### Mongodb Configuration ##########################
spring.data.mongodb.uri=${MONGODB_URI_REPORT}
spring.data.mongodb.database=medilabo_report_db

logging.level.org.springframework.security=DEBUG



